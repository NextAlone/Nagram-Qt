name: Nagram guards.

on:
  push:
    branches:
      - nagram-next
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  guards:
    name: Guards
    runs-on: ubuntu-24.04

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the upstream base.
        run: |
          base=$(python3 -c "import json; print(json.load(open('tools/nagram/upstream.json'))['base'])")
          tools/nagram/retry.sh 3 30 git fetch --no-tags --depth=1 origin "$base"

      - name: Tool tests.
        run: |
          python3 tools/nagram/test_retry.py
          python3 tools/nagram/test_smoke_test.py
          python3 tools/nagram/test_upstream_budget.py
          python3 tools/nagram/test_drop_superseded_caches.py
          python3 tools/nagram/test_check_settings_index.py
          python3 tools/nagram/test_release_version.py
          python3 tools/nagram/test_update_keys.py
          python3 tools/nagram/test_sign_macos.py
          python3 tools/nagram/test_macos_dmg.py
          python3 tools/nagram/test_update_feed.py
          python3 tools/nagram/test_pack_update.py
          python3 tools/nagram/test_linux_tree.py
          python3 tools/nagram/test_aur_package.py
          python3 tools/nagram/test_rpm_package.py
          python3 tools/nagram/test_nix_release.py
          python3 tools/nagram/test_homebrew_cask.py
          python3 tools/nagram/test_gcc_check.py

      - name: Upstream budget.
        run: python3 tools/nagram/upstream_budget.py

      - name: Settings search index.
        run: python3 tools/nagram/check_settings_index.py
