name: Nagram Windows.

on:
  push:
    branches:
      - nagram-next
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/nagram-win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/nagram-win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

  workflow_call:
    inputs:
      config:
        type: string
        default: Debug
      ref:
        type: string
        default: ""
      archs:
        type: string
        default: '["x64","arm64"]'

jobs:

  windows:
    # A push whose commit message has a marker such as [windows-only] builds
    # only the named platforms; several markers may be combined.
    if: >-
      inputs.config == 'Release'
      || github.event_name != 'push'
      || !contains(github.event.head_commit.message, '-only]')
      || contains(github.event.head_commit.message, '[windows-only]')
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025-vs2026' }}

    # Dropping superseded caches needs to delete them.
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs || '["x64","arm64"]') }}
        qt: [qt6]
        generator: [""]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # Not CONFIG: pacman-key in the msys2 setup reads that variable as the
      # path of its configuration file.
      BUILD_CONFIG: ${{ inputs.config || 'Debug' }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      # Building Qt in both configurations fills the system drive of the
      # hosted runner.
      - name: Free up disk space for the libraries.
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          $paths = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\ghcup',
            'C:\Miniconda',
            'C:\Julia',
            'C:\rtools45',
            'C:\SeleniumWebDrivers',
            'C:\vcpkg',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              cmd /c rmdir /s /q "$path"
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

      # Release compilation on the x64 runner runs out of memory otherwise
      # (C1060, compiler is out of heap space).
      - name: Enlarge the page file.
        if: matrix.arch == 'x64' && env.BUILD_CONFIG == 'Release'
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 48GB
          disk-root: "D:"

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
          ref: ${{ inputs.ref }}

      # Upstream keeps these Qt 6 fixes on the win7-qt6 branch of lib_ui.
      # A patch that stops applying has reached the pinned commit: drop it.
      - name: Patch lib_ui.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME/Telegram/lib_ui"
          git apply --verbose ../../tools/nagram/patches/lib_ui/*.diff

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe `
            -MaximumRetryCount 5 -RetryIntervalSec 10
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      # The release part of the libraries builds breakpad's dump_syms, which
      # needs ATL for the pinned x64 toolset.
      - name: Install ATL.
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          $path = & (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe') -latest -products * -property installationPath
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            'modify','--installPath',"`"$path`"",'--quiet','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL'
          Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') | ForEach-Object {
            "$($_.Name): atlmfc=$(Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h'))"
          }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223 # master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Debug and Release share one copy of the libraries, built with their
      # release variants: caches saved by a tag run are visible only to that
      # tag, and a second copy does not fit the repository quota.
      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v2-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      # Before the caches are saved, so they hold only what the build needs.
      # tdesktop_rust/out/src/wallet_engine holds the generated
      # wallet_engine.cpp, which cmake/external/wallet_engine compiles into the
      # app: a build input that matches none of the extensions kept below. The
      # tlottie and wallet-engine checkouts are the sources of the
      # tdesktop_rust stage, so a cache without them restores a valid stage key
      # and cannot rebuild the stage; only their cargo target trees are
      # dropped. The expression is the one of the Windows job of canary.yml.
      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' ')' -type f ')' -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' ')' -delete

      # The combined cache steps save only when the whole job succeeds, which
      # would lose hours of libraries to a later failure.
      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v2-${{ env.CACHE_KEY }}

      # Old caches would push the libraries out of the repository quota.
      - name: Drop superseded caches.
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THIRD_PARTY_KEY: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          LIBS_KEY: ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-${{ env.CACHE_KEY }}
          QT_KEY: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-v2-${{ env.CACHE_KEY }}
        run: |
          bash "$TBUILD/$REPO_NAME/tools/nagram/drop_superseded_caches.sh" \
            "$THIRD_PARTY_KEY" "$LIBS_KEY" "$QT_KEY"

      - name: Read configuration matrix.
        shell: bash
        env:
          NAGRAM_API_ID: ${{ secrets.NAGRAM_API_ID }}
        run: |
          ARTIFACT_NAME="Nagram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          # Without the repository secrets, build with the test-only credentials.
          API=""
          if [ -z "$NAGRAM_API_ID" ]; then
            API="-D TDESKTOP_API_TEST=ON"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Nagram build.
        if: env.ONLY_CACHE == 'false'
        env:
          NAGRAM_API_ID: ${{ secrets.NAGRAM_API_ID }}
          NAGRAM_API_HASH: ${{ secrets.NAGRAM_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% ^
          -D DESKTOP_APP_TEST_APPS=ON ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=${{ env.BUILD_CONFIG == 'Debug' && 'ON' || 'OFF' }} ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=${{ env.BUILD_CONFIG == 'Release' && 'OFF' || 'ON' }} ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config %BUILD_CONFIG% --parallel
          if errorlevel 1 exit /b 1
          ..\out\nagram-tests\%BUILD_CONFIG%\test_nagram.exe

      - name: Smoke test.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%
          python tools\nagram\smoke_test.py out\%BUILD_CONFIG%\Nagram.exe

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        env:
          NAGRAM_UPDATE_KEY: ${{ secrets.NAGRAM_UPDATE_KEY }}
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_CONFIG%
          mkdir artifact
          if "%BUILD_CONFIG%"=="Release" (
            powershell -Command "Compress-Archive -Path '%OUT%\Nagram.exe' -DestinationPath 'artifact\Nagram-windows-${{ matrix.arch }}.zip'"
            if errorlevel 1 exit /b 1
            if defined NAGRAM_UPDATE_KEY (
              python %TBUILD%\%REPO_NAME%\tools\nagram\pack_update.py --packer %OUT%\Packer.exe --out artifact --app %OUT%\Nagram.exe --updater %OUT%\Updater.exe --target ${{ matrix.arch == 'arm64' && 'winarm' || 'win64' }}
              if errorlevel 1 exit /b 1
            ) else (
              echo ::warning::NAGRAM_UPDATE_KEY is not set: no update package, this build is not offered to installed copies.
            )
            echo ARTIFACT_NAME=release-windows-${{ matrix.arch }}>>%GITHUB_ENV%
          ) else (
            powershell -Command "Compress-Archive -Path '%OUT%\Nagram.exe' -DestinationPath 'artifact\Nagram-windows-${{ matrix.arch }}-debug.zip'"
            if errorlevel 1 exit /b 1
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 1

      # The portable archive is uploaded by now, so a failing installer
      # build does not keep it out of the release.
      - name: Installer.
        if: env.UPLOAD_ARTIFACT == 'true' && env.BUILD_CONFIG == 'Release'
        run: |
          cd %TBUILD%\%REPO_NAME%
          if not exist Telegram\build\nagram_version (
            echo ::notice::This ref has no Telegram\build\nagram_version, no installer is built.
            exit /b 0
          )
          for /f %%v in ('python tools\nagram\release_version.py --version') do set NAGRAM_VERSION=%%v
          if not defined NAGRAM_VERSION exit /b 1
          set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" choco install innosetup --no-progress -y
          if not exist "%ISCC%" exit /b 1
          "%ISCC%" /Qp /DMyAppVersion=%NAGRAM_VERSION% /DMyAppVersionFull=%NAGRAM_VERSION% "/DReleasePath=%TBUILD%\%REPO_NAME%\out\%BUILD_CONFIG%" /DMyBuildTarget=${{ matrix.arch == 'arm64' && 'winarm' || 'win64' }} /DMyOutputBaseFilename=Nagram-windows-${{ matrix.arch }}-setup "/O%GITHUB_WORKSPACE%\installer" Telegram\build\setup.iss
          if errorlevel 1 exit /b 1
          if not exist "%GITHUB_WORKSPACE%\installer\Nagram-windows-${{ matrix.arch }}-setup.exe" exit /b 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload installer.
        if: env.UPLOAD_ARTIFACT == 'true' && env.BUILD_CONFIG == 'Release' && hashFiles('installer/*.exe') != ''
        with:
          name: release-windows-${{ matrix.arch }}-setup
          path: installer\
          retention-days: 1

  channel:
    name: Channel
    needs: windows
    # Debug builds of the default branch are posted to the assets channel;
    # a release posts its own packages from nagram-release.yml.
    if: ${{ inputs.config != 'Release' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    uses: ./.github/workflows/nagram-channel.yml
    permissions:
      contents: read
    with:
      platform: windows
    secrets: inherit
